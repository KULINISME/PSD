  if(g.image){ L.imageOverlay(g.image,g.bounds,{opacity:.85,className:'pix'}).addTo(grp); }
  (g.items||[]).forEach(function(p){
    var st={color:p.stroke,weight:p.weight,dashArray:p.dash,fillColor:p.fill,fillOpacity:.7};
    L.polygon(p.c,st).bindPopup(p.popup).addTo(grp);
    L.circleMarker(p.m,{radius:p.r,color:p.stroke,weight:p.weight,dashArray:p.dash,fillColor:p.fill,fillOpacity:.9}).bindPopup(p.popup).addTo(grp);
  });
  grp.addTo(map); overlays[g.name]=grp;
});
L.control.layers({'OpenStreetMap':osm,'Citra Satelit (Esri)':sat},overlays,{collapsed:false}).addTo(map);
map.fitBounds(BOUNDS);
var lg=L.control({position:'bottomleft'});
lg.onAdd=function(){var d=L.DomUtil.create('div','legend');
  d.innerHTML='<b>Prediksi regional Jawa Timur (~250 m)</b>'+LEGEND.map(function(x){return '<div><i style="background:'+x[1]+'"></i>'+x[0]+'</div>'}).join('');return d;};
lg.addTo(map);
